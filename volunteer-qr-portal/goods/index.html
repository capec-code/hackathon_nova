<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goods & Inventory | Hackathon Nova 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap");

    :root {
      --primary: #ea580c;
      --secondary: #0f172a;
      --accent: #22d3ee;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #0e172b;
      color: #f8fafc;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 1rem;
    }
    
    .status-bought { @apply bg-green-500/10 text-green-400 border-green-500/20; }
    .status-pending { @apply bg-orange-500/10 text-orange-400 border-orange-500/20; }
    
    .hidden-state { display: none !important; }

    /* Custom Mobile Table Handling */
    @media (max-width: 640px) {
      .mobile-card-row {
        @apply flex flex-col p-4 space-y-2 border-b border-gray-800;
      }
      .mobile-label {
        @apply text-[10px] uppercase text-gray-500 font-bold block mb-0.5;
      }
    }
    
    /* Fix Input Colors */
    input, select {
        @apply bg-gray-900 border border-gray-700 text-white placeholder-gray-500;
        color-scheme: dark;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">
  <!-- Navigation -->
  <nav class="fixed top-0 w-full bg-black/80 backdrop-blur-lg border-b border-gray-800 z-50">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <a href="../">
            <img src="../assets/logo.png" alt="Logo" class="w-8 h-8 rounded-lg" />
          </a>
          <span class="font-bold text-lg text-orange-500 truncate max-w-[150px] sm:max-w-none">Goods Panel</span>
        </div>
        <div class="flex space-x-3 sm:space-x-6 items-center text-xs font-medium">
          <a href="https://hackathon-nova.com" class="text-gray-400 hover:text-white transition hidden sm:block">Main Site</a>
          <a href="../expenses/" class="text-gray-400 hover:text-white transition">Expenses</a>
          <a href="../super-admin/" class="px-3 py-1.5 bg-gray-800 rounded-lg hover:bg-gray-700 transition">Admin</a>
          <div id="user-badge" class="hidden flex items-center bg-orange-500/10 px-3 py-1.5 rounded-full border border-orange-500/20">
            <span id="display-code" class="text-orange-500 font-bold text-[10px] sm:text-xs">CODE: ****</span>
            <button onclick="logout()" class="ml-2 text-gray-400 hover:text-white transition">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Login Overlay -->
  <div id="login-screen" class="flex-1 flex items-center justify-center p-4 pt-20">
    <div class="glass-card max-w-md w-full p-8 sm:p-10 text-center shadow-2xl relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 to-green-500"></div>
      <div class="mb-8">
        <div class="w-16 h-16 bg-orange-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-orange-500/30">
          <i class="fas fa-shield-alt text-2xl text-orange-500"></i>
        </div>
        <h2 class="text-2xl sm:text-3xl font-black text-white mb-2">Inventory Access</h2>
        <p class="text-gray-400 text-sm">Enter secret validator code.</p>
      </div>
      <form id="login-form" class="space-y-4">
        <input type="password" id="secret_code" placeholder="Enter Secret Code" 
          class="w-full bg-black/40 border-2 border-gray-800 rounded-xl px-6 py-4 text-center text-2xl tracking-[0.5em] focus:border-orange-500 outline-none transition-all placeholder:tracking-normal placeholder:text-base text-white" />
        <button type="submit" id="login-btn"
          class="w-full bg-gradient-to-r from-orange-600 to-orange-500 hover:from-orange-500 hover:to-orange-400 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-orange-500/20">
          Unlock Inventory
        </button>
      </form>
      <p id="login-error" class="text-red-500 text-xs mt-4 hidden"></p>
    </div>
  </div>

  <main id="main-dashboard" class="pt-24 pb-12 px-4 max-w-7xl mx-auto hidden-state">
    <!-- Header Summary -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="glass-card p-4 border-l-4 border-orange-500">
        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider">Total</p>
        <h2 id="summary-total-items" class="text-xl sm:text-2xl font-black mt-1">--</h2>
      </div>
      <div class="glass-card p-4 border-l-4 border-green-500">
        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider">Bought</p>
        <h2 id="summary-bought-items" class="text-xl sm:text-2xl font-black mt-1">--</h2>
      </div>
      <div class="glass-card p-4 border-l-4 border-cyan-500 col-span-2 md:col-span-1">
        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider">Est. Cost</p>
        <h2 id="summary-est-cost" class="text-xl sm:text-2xl font-black mt-1">Rs. --</h2>
      </div>
      <div class="glass-card p-4 border-l-4 border-purple-500 col-span-2 md:col-span-1">
        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider">Actual Cost</p>
        <h2 id="summary-actual-cost" class="text-xl sm:text-2xl font-black mt-1">Rs. --</h2>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
      <!-- Entry Form -->
      <div class="lg:col-span-1 order-2 lg:order-1">
        <div class="glass-card p-6">
          <h3 class="text-lg font-bold mb-6 flex items-center">
            <i class="fas fa-plus-circle text-orange-500 mr-2"></i> Add Item
          </h3>
          <form id="goods-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Item Name</label>
              <input type="text" id="item_name" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-orange-500 transition" />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Qty</label>
                <input type="number" id="quantity" value="1" min="1" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-orange-500" />
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Category</label>
                <select id="category" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-orange-500">
                  <option value="General">General</option>
                  <option value="Stationery">Stationery</option>
                  <option value="Food & Drinks">Food & Drinks</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Prizes">Prizes</option>
                  <option value="Marketing">Marketing</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Est. Cost</label>
                <input type="number" id="est_cost" step="0.01" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-orange-500" />
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Status</label>
                <select id="status" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-orange-500">
                  <option value="To Be Bought">Pending</option>
                  <option value="Bought">Bought</option>
                </select>
              </div>
            </div>
            <div id="bought-fields" class="hidden space-y-4">
              <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Actual Cost</label>
                <input type="number" id="actual_cost" step="0.01" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-orange-500" />
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Vendor</label>
                <input type="text" id="vendor" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-orange-500" />
              </div>
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl mt-4 transition-all">
              Add to Inventory
            </button>
          </form>
        </div>
      </div>

      <!-- Inventory Table -->
      <div class="lg:col-span-2 order-1 lg:order-2">
        <div class="glass-card overflow-hidden">
          <div class="p-5 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <h3 class="text-xl font-bold">Inventory List</h3>
            <div class="flex space-x-2 w-full sm:w-auto">
                <button onclick="exportInventory()" class="text-white bg-gray-800 px-3 py-2 rounded-lg text-xs font-bold hover:bg-gray-700 transition">
                    <i class="fas fa-file-export mr-1"></i> Export
                </button>
                <input type="text" id="search-box" placeholder="Search items..." class="flex-1 sm:w-auto bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm outline-none focus:border-orange-500 text-white" />
            </div>
          </div>
          
          <!-- Desktop Table -->
          <div class="hidden sm:block overflow-x-auto">
            <table class="w-full text-left">
              <thead class="bg-gray-800/50 text-gray-500 text-[10px] uppercase font-bold">
                <tr>
                  <th class="px-6 py-4">Item</th>
                  <th class="px-6 py-4">Status</th>
                  <th class="px-6 py-4 text-right">Est. Cost</th>
                  <th class="px-6 py-4 text-right">Actual</th>
                  <th class="px-6 py-4 text-center">Action</th>
                </tr>
              </thead>
              <tbody id="inventory-table-body" class="divide-y divide-gray-800">
                <!-- Data here -->
              </tbody>
            </table>
          </div>

          <!-- Mobile Cards (JS will populate both or use a single list with responsive classes) -->
          <div id="inventory-mobile-list" class="sm:hidden divide-y divide-gray-800">
            <!-- Mobile cards here -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/supabase-config.js"></script>
  <script src="script.js"></script>
  <script>
    const statusSelect = document.getElementById('status');
    const boughtFields = document.getElementById('bought-fields');
    statusSelect.addEventListener('change', () => {
      boughtFields.classList.toggle('hidden', statusSelect.value !== 'Bought');
    });
  </script>
</body>
</html>
